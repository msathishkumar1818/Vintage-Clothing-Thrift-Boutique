<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Radiant Gold Gradients -->
    <linearGradient id="brightGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="40%" stop-color="#F5D061" />
      <stop offset="80%" stop-color="#D4A373" />
      <stop offset="100%" stop-color="#9C6B38" />
    </linearGradient>

    <!-- Vibrant Emerald / Boutique Teal Gradients -->
    <linearGradient id="emeraldDress" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="45%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Crisp Bright Outer Badge Background for Tab Contrast -->
    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#FAF5EE" />
      <stop offset="100%" stop-color="#F2EAE1" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Bright Circular Badge: Ensures 100% Visibility on Dark Browser Tabs -->
  <circle cx="64" cy="64" r="60" fill="url(#badgeGlow)" stroke="url(#brightGold)" stroke-width="4.5" />
  <circle cx="64" cy="64" r="56" fill="none" stroke="#D4A373" stroke-width="1.2" opacity="0.6" />

  <!-- Laurel Wreath Leaves (Left Side) -->
  <g fill="url(#brightGold)" stroke="#9C6B38" stroke-width="0.5">
    <!-- Outer Arc Left -->
    <path d="M 22 84 C 15 65 24 45 42 34" fill="none" stroke="url(#brightGold)" stroke-width="3" stroke-linecap="round" />
    <!-- Leaf Cluster Left Bottom -->
    <path d="M 22 84 Q 14 78 12 70 Q 20 74 22 84 Z" />
    <path d="M 20 88 Q 11 86 6 80 Q 14 83 20 88 Z" />
    <path d="M 23 93 Q 16 95 10 93 Q 18 90 23 93 Z" />
    <path d="M 25 80 Q 15 70 18 60 Q 24 67 25 80 Z" />
  </g>

  <!-- Laurel Wreath Leaves (Right Side) -->
  <g fill="url(#brightGold)" stroke="#9C6B38" stroke-width="0.5">
    <!-- Outer Arc Right -->
    <path d="M 106 84 C 113 65 104 45 86 34" fill="none" stroke="url(#brightGold)" stroke-width="3" stroke-linecap="round" />
    <!-- Leaf Cluster Right Bottom -->
    <path d="M 106 84 Q 114 78 116 70 Q 108 74 106 84 Z" />
    <path d="M 108 88 Q 117 86 122 80 Q 114 83 108 88 Z" />
    <path d="M 105 93 Q 112 95 118 93 Q 110 90 105 93 Z" />
    <path d="M 103 80 Q 113 70 110 60 Q 104 67 103 80 Z" />
  </g>

  <!-- Golden Wooden Hanger (Exact Shape from Logo) -->
  <!-- Top Hook -->
  <path d="M 64 26 C 68 26 71 23 71 19 C 71 14 66 11 63 15 C 61 17 62 20 62 22 L 64 28" 
        fill="none" stroke="url(#brightGold)" stroke-width="3.5" stroke-linecap="round" filter="url(#softGlow)" />
  
  <!-- Hanger Wooden Bar -->
  <path d="M 38 38 Q 64 27 90 38 Q 64 33 38 38 Z" 
        fill="url(#brightGold)" stroke="#9C6B38" stroke-width="1" filter="url(#softGlow)" />

  <!-- Dress Straps -->
  <path d="M 49 35 L 52 46" stroke="url(#emeraldDress)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 79 35 L 76 46" stroke="url(#emeraldDress)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Dress Bodice (Sweetheart Neckline) -->
  <path d="M 48 46 Q 58 40 64 45 Q 70 40 80 46 L 75 66 L 53 66 Z" 
        fill="url(#emeraldDress)" stroke="#064E3B" stroke-width="1.2" filter="url(#softGlow)" />

  <!-- Bodice Highlight -->
  <path d="M 52 48 Q 58 44 64 48" fill="none" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 64 48 Q 70 44 76 48" fill="none" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- Gold Waistline Belt with Buckle -->
  <rect x="51.5" y="65" width="25" height="6.5" rx="1.5" fill="url(#brightGold)" stroke="#9C6B38" stroke-width="0.8" />
  <rect x="60.5" y="63" width="7" height="10.5" rx="1.5" fill="#FFFFFF" stroke="#9C6B38" stroke-width="1.5" />
  <rect x="62.5" y="65.5" width="3" height="5.5" fill="url(#brightGold)" />

  <!-- Flared Vintage A-Line Skirt (Exact Header Logo Silhouette) -->
  <path d="M 52 71 C 46 84 37 98 30 106 C 45 110 83 110 98 106 C 91 98 82 84 76 71 Z" 
        fill="url(#emeraldDress)" stroke="#064E3B" stroke-width="1.2" filter="url(#softGlow)" />

  <!-- Skirt Vertical Pleats & Radiance Lines (Bright Ivory/Gold) -->
  <path d="M 64 71 L 64 109" stroke="#CCFBF1" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <path d="M 58 71 Q 53 88 47 107" stroke="url(#brightGold)" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
  <path d="M 70 71 Q 75 88 81 107" stroke="url(#brightGold)" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
  <path d="M 54 71 Q 45 88 36 105" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <path d="M 74 71 Q 83 88 92 105" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  <!-- Boutique Sparkle Stars for High Visibility -->
  <polygon points="26,38 28,42 32,44 28,46 26,50 24,46 20,44 24,42" fill="url(#brightGold)" />
  <polygon points="102,38 104,42 108,44 104,46 102,50 100,46 96,44 100,42" fill="url(#brightGold)" />
</svg>
